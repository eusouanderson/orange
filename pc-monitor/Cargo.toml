[package]
name = "orange-pc-monitor"
version = "0.1.0"
authors = ["Orange Engineering Team <eusouanderson@outlook.com>"]
edition = "2021"
description = "Ultra Low-Resource System Hardware & OS HUD by Orange Framework"
license = "MIT"

[lib]
name = "orange_pc_monitor"
path = "src/lib.rs"

[[bin]]
name = "orange-pc-monitor"
path = "src/main.rs"

[dependencies]
sysinfo = "0.33"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse"
] }

[dev-dependencies]
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

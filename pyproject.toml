[build-system]
requires = [ "poetry-core>=1.0.0",]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "orange-micro-framework"
version = "0.1.148"
description = "Professional Python compilation, optimization, and packaging framework using Cython, PyInstaller, and CI/CD."
authors = [ "Anderson Rodrigues <eusouanderson@outlook.com>",]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/eusouanderson/orange"
repository = "https://github.com/eusouanderson/orange"
documentation = "https://github.com/eusouanderson/orange/blob/main/README.md"
keywords = [ "cython", "pyinstaller", "python-packager", "compiler", "executable", "cicd", "cross-platform"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers",
]
packages = [{include = "orange"}]

[tool.poetry.scripts]
orange = "orange.cli.main:cli"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
click = "^8.1.7"
cython = "^3.0.11"
pyinstaller = "^6.14.2"
tomli = {version = "^2.2.1", python = "<3.11"}
pandas = "^2.2.3"
PyQt6 = "^6.8.0"
Pillow = "^11.0.0"

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = [
    'E501',     # line-too-long (formatação tratada pelo ruff format)
    'PLR2004',  # magic-value-comparison
    'PLR6301',  # no-self-use (necessário para slots Qt e métodos de teste/interface)
    'PLR0912',  # too-many-branches
    'PLR0913',  # too-many-arguments
    'PLR0914',  # too-many-locals
    'PLR0915',  # too-many-statements
    'PLR0917',  # too-many-positional-arguments
    'PLR1702',  # too-many-nested-blocks
    'PLW0717',  # too-many-statements-in-try-clause
    'PLW0603',  # global-statement
    'PLC0415',  # import-outside-top-level
]

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['PT015', 'PT017']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.poetry.group.dev.dependencies]
cython = "^3.0.11"
colorama = "^0.4.6"
tomli = "^2.2.1"
pyinstaller = "^6.14.2"
black = "^25.1.0"
pytest = "^8.3.4"
watchdog = "^4.0.0"
pytest-cov = "^7.0.0"
pytest-benchmark = "^5.2.3"
ruff = "^0.17.5"
pyyaml = "^6.0.3"

[tool.taskipy.tasks]
test = "pytest"
lint = "ruff check"
format = "ruff format ."
cythonize = "cythonize -i src/**/*.py"
run = "python src/core/main.py"
build = "python compile/build.py linux v0.1.145 --compile-all"
clean_imp  = "python scripts/clean-imports.py"
clean= "rm -rf build dist *.spec __pycache__ .pytest_cache"
watch = "watchmedo shell-command --patterns='*.py' --recursive --command='task run' src/"



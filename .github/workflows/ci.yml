name: CI (Lint & Unit Tests)

"on":
  push:
    branches: [main, master, 'feature/*', 'fix/*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar Dependências de Desenvolvimento
        run: poetry install --with dev

      - name: Verificar Linting com Ruff
        run: poetry run ruff check

      - name: Verificar Formatação com Ruff
        run: poetry run ruff format --check

  test-matrix:
    name: Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Pacotes de Sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential upx libgl1 libegl1 libxkbcommon0

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar Dependências do Projeto
        run: poetry install --with dev

      - name: Diagnóstico de Ambiente
        run: poetry run orange doctor

      - name: Executar Testes Rápidos
        run: poetry run pytest -k "not test_performance" --cov=orange --cov-report=xml

      - name: Upload de Cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

name: Cross-Platform Build Pipeline

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-matrix:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Build com Orange Action
        uses: ./
        with:
          source: ./src
          output: ./dist
          profile: production
          compile-all: false
          python-version: '3.12'
          orange-version: 'local'
          cache: true
          upload-artifact: true
          artifact-name: orange-standalone

version: '3.8'

services:
  # Serviço para compilar o executável no container e gravá-lo no host (./dist)
  orange-build:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: orange-compiler
    volumes:
      - ./dist:/app/dist
      - ./.orange/cache:/app/.orange/cache
    command: ["orange", "build", "--profile", "production", "--clean"]

  # Serviço para executar a imagem mínima com o aplicativo compilado
  orange-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: orange-runtime
    environment:
      - QT_QPA_PLATFORM=offscreen
